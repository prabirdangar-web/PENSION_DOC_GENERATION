<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pension Document Generator</title>
  <style>
    /* =========================================================================
       BASE & LAYOUT STYLES
       ========================================================================= */
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg-gray: #f3f4f6;
      --border-color: #d1d5db;
      --text-main: #1f2937;
      --sidebar-width: 320px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text-main); background: var(--bg-gray); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: var(--sidebar-width); background: #ffffff; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: margin-left 0.3s ease; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); background: #f8fafc; }
    .sidebar-header h2 { font-size: 1.1rem; color: var(--primary); margin-bottom: 10px; }
    .search-box { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem; }
    .record-list { flex: 1; overflow-y: auto; padding: 10px; }
    .record-item { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; cursor: pointer; background: #fff; transition: all 0.2s; }
    .record-item:hover { background: #eff6ff; border-color: #93c5fd; }
    .record-item.active { background: #dbeafe; border-color: var(--primary); }
    .record-item .name { font-weight: 600; font-size: 0.95rem; }
    .record-item .sub { font-size: 0.8rem; color: #6b7280; margin-top: 2px; }

    /* Main Container */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; }
    
    /* Top Toolbar & Tabs */
    .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #f8fafc; border-bottom: 1px solid var(--border-color); }
    .actions { display: flex; gap: 8px; }
    .btn { padding: 8px 14px; border: 1px solid var(--border-color); border-radius: 4px; background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; transition: background 0.2s; }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: #ef4444; color: #fff; border-color: #ef4444; }
    .btn-danger:hover { background: #dc2626; }

    .tabs-bar { display: flex; background: #f1f5f9; border-bottom: 1px solid var(--border-color); padding: 0 15px; }
    .tab { padding: 12px 18px; cursor: pointer; border-bottom: 2px solid transparent; font-weight: 500; font-size: 0.9rem; color: #64748b; }
    .tab:hover { color: var(--primary); }
    .tab.active { border-bottom-color: var(--primary); color: var(--primary); background: #fff; }

    /* Content Area */
    .content-area { flex: 1; overflow-y: auto; padding: 25px; }

    /* Form Styles */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; max-width: 900px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: #374151; }
    .form-control { padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem; }
    .form-control:focus { outline: none; border-color: var(--primary); ring: 2px solid #bfdbfe; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; font-weight: normal; }

    /* Document Output Styles */
    .doc-container { max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    .doc-page { line-height: 1.8; font-size: 15px; color: #000; }
    .doc-page h2, .doc-page h3 { text-align: center; margin-bottom: 15px; }
    .status { padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; margin-top: 5px; }
    .status.ok { background: #dcfce7; color: #15803d; }
    .status.err { background: #fee2e2; color: #b91c1c; }

    /* Print Formatting */
    @media print {
      body { background: #fff; }
      .sidebar, .toolbar, .tabs-bar { display: none !important; }
      .main-content, .content-area { overflow: visible !important; padding: 0 !important; }
      .doc-container { border: none !important; box-shadow: none !important; padding: 0 !important; max-width: 100% !important; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Pension Records</h2>
      <input type="text" id="searchBox" class="search-box" placeholder="Search employee name...">
      <div id="sideStatus"></div>
    </div>
    <div class="record-list" id="recordList"></div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    <!-- TOOLBAR -->
    <div class="toolbar">
      <button class="btn" id="btnToggleSidebar">☰ Menu</button>
      <div class="actions">
        <button class="btn" id="btnNew">+ New Record</button>
        <button class="btn btn-primary" id="btnSave">Save Record</button>
        <button class="btn" id="btnDuplicate">Duplicate</button>
        <button class="btn" id="btnResetForm">Undo Changes</button>
        <button class="btn btn-danger" id="btnDelete">Delete</button>
        <button class="btn" id="btnPrintOne">🖨️ Print Document</button>
      </div>
    </div>

    <!-- TAB NAVIGATION -->
    <div class="tabs-bar">
      <div class="tab active" data-tab="form">Employee Form</div>
      <div class="tab" data-tab="payCert">Pay Certificate</div>
      <div class="tab" data-tab="hraCert">HRA Certificate</div>
      <div class="tab" data-tab="hraDecl">HRA Declaration</div>
    </div>

    <!-- DYNAMIC CONTENT VIEW -->
    <div class="content-area" id="contentView"></div>
  </main>

  <script>
    /* =========================================================================
       DATA HANDLING & LOCAL STORAGE MODULE
       ========================================================================= */
    const STORAGE_KEY_INDEX = "pension_doc_index_v1";
    const STORAGE_PREFIX = "pension_doc_rec_";

    function defaultRecord() {
      return {
        id: null,
        staffName: "RADHARAMAN PAINE",
        gender: "M", // "M" or "F"
        designation: "ASSISTANT TEACHER",
        payScale: "LEVEL-14-PB-4-9000-40500-GP-RS-4700",
        basicPay: "94,100",
        payAsOfDate: "01-07-2026",
        lastIncDate: "NIL",
        noIncDue: true, // Toggle for NIL increment
        dor: "30-06-2027",
        spouseName: "Rina Paine",
        spouseOccupation: "Housewife",
        savedAt: null
      };
    }

    let current = defaultRecord();
    let originalSnapshot = JSON.stringify(current);
    let dirty = false;
    let activeTab = "form";

    // Storage Utilities
    async function loadIndex() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_INDEX)) || [];
      } catch(e) { return []; }
    }

    async function saveIndex(ids) {
      localStorage.setItem(STORAGE_KEY_INDEX, JSON.stringify(ids));
    }

    async function loadRecordStorage(id) {
      try {
        const data = localStorage.getItem(STORAGE_PREFIX + id);
        return data ? JSON.parse(data) : null;
      } catch(e) { return null; }
    }

    async function saveRecord(rec) {
      localStorage.setItem(STORAGE_PREFIX + rec.id, JSON.stringify(rec));
    }

    async function deleteRecordStorage(id) {
      localStorage.removeItem(STORAGE_PREFIX + id);
      let ids = await loadIndex();
      ids = ids.filter(i => i !== id);
      await saveIndex(ids);
    }

    /* =========================================================================
       HELPER & FORMATTING UTILITIES
       ========================================================================= */
    const $ = selector => document.querySelector(selector);
    const $$ = selector => document.querySelectorAll(selector);

    function newId() {
      return "rec_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function proper(str) {
      if (!str) return "";
      return str.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
    }

    function getGenderTerms(gender) {
      const isFemale = (gender || "M").toUpperCase() === "F";
      return {
        empPossessive: isFemale ? "her" : "his",
        empPossessiveCap: isFemale ? "Her" : "His",
        spouseRel: isFemale ? "Husband" : "Wife",
        spouseRelLower: isFemale ? "husband" : "wife",
        spouseSubj: isFemale ? "He" : "She",
        spouseObj: isFemale ? "him" : "her"
      };
    }

    /* =========================================================================
       DOCUMENT TEMPLATE GENERATORS (WITH ANOMALY FIXES)
       ========================================================================= */

    // ANOMALY 1 FIX: Pay Certificate Continuation Clause Logic
    function renderPayCertClauseB(rec) {
      const terms = getGenderTerms(rec.gender);
      const isNil = rec.noIncDue || !rec.lastIncDate || rec.lastIncDate.trim().toUpperCase() === "NIL";

      if (isNil) {
        return `(b) ${terms.empPossessiveCap} last increment before retirement in the aforesaid scale was due on <strong>NIL</strong> for which ${terms.empPossessive} pay <strong>Rs. ${escapeHtml(rec.basicPay)} p.m. WILL CONTINUE</strong> up to the date of ${terms.empPossessive} Superannuation on <strong>${escapeHtml(rec.dor)}</strong>.`;
      }

      return `(b) ${terms.empPossessiveCap} last increment before retirement in the aforesaid scale was due on <strong>${escapeHtml(rec.lastIncDate)}</strong> which raised ${terms.empPossessive} pay to <strong>Rs. ${escapeHtml(rec.basicPay)} p.m.</strong> up to the date of ${terms.empPossessive} Superannuation on <strong>${escapeHtml(rec.dor)}</strong>.`;
    }

    function renderPayCertTab(rec) {
      const terms = getGenderTerms(rec.gender);
      return `
        <div class="doc-container">
          <div class="doc-page">
            <h2 style="text-decoration: underline;">PAY CERTIFICATE</h2>
            <br>
            <p style="text-align: justify;">
              1. (a) The Basic pay of Shri/Smt <strong>${escapeHtml(rec.staffName)}</strong> as on <strong>${escapeHtml(rec.payAsOfDate)}</strong> was <strong>Rs. ${escapeHtml(rec.basicPay)} p.m.</strong> in the scale of pay of <strong>Rs. ${escapeHtml(rec.payScale)}</strong>.
            </p>
            <br>
            <p style="text-align: justify;">
              ${renderPayCertClauseB(rec)}
            </p>
            <br><br><br>
            <div style="display: flex; justify-content: space-between; margin-top: 60px;">
              <div>Date: ______________</div>
              <div style="text-align: center;">
                ____________________________<br>
                Signature of Head of Institution
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ANOMALY 2 FIX: HRA Certificate Gender & Spouse Pronouns
    function renderHraCertTab(rec) {
      const terms = getGenderTerms(rec.gender);
      const occupation = rec.spouseOccupation || "Housewife";

      return `
        <div class="doc-container">
          <div class="doc-page">
            <h2 style="text-decoration: underline;">HRA CERTIFICATE</h2>
            <p style="text-align: center; font-weight: bold; margin-bottom: 25px;">Certificate regarding Employment / Non-Employment and HRA of the Spouse</p>
            
            <p style="text-align: justify; line-height: 1.8;">
              Certified that <strong>${escapeHtml(rec.spouseName)}</strong>, ${terms.spouseRel} of <strong>${escapeHtml(rec.staffName)}</strong> is ${escapeHtml(occupation)} and not in service. ${terms.spouseSubj} was not engaged in any service under the Government of India or any State Government Undertaking or any statutory or Local body, Educational Institution, etc. at anywhere and anytime since or before their marriage, and hence no question for drawal of HRA by ${terms.spouseObj}. HRA drawn by <strong>${escapeHtml(rec.staffName)}</strong> is as per Grant-in-Aid rules and within the prescribed limit throughout ${terms.empPossessive} service.
            </p>
            <br><br><br>
            <div style="display: flex; justify-content: space-between; margin-top: 60px;">
              <div>Date: ______________</div>
              <div style="text-align: center;">
                ____________________________<br>
                Signature of Head of Institution
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ANOMALY 3 FIX: HRA Declaration Duplicated Text
    function renderHraDeclTab(rec) {
      const terms = getGenderTerms(rec.gender);

      return `
        <div class="doc-container">
          <div class="doc-page">
            <h2 style="text-decoration: underline;">HRA DECLARATION</h2>
            <p style="margin-top: 15px;"><strong>Sub:</strong> Declaration regarding Employment / Non-Employment and HRA of the Spouse</p>
            <br>
            <p>Sir / Madam,</p>
            <br>
            <p style="text-align: justify; line-height: 1.8;">
              I, <strong>${escapeHtml(rec.staffName)}</strong>; <strong>${escapeHtml(rec.designation)}</strong> of this school, do hereby declare that my ${terms.spouseRelLower} <strong>${escapeHtml(rec.spouseName)}</strong> is not in service and hence no question for drawal by spouse. HRA drawn / is being drawn by me is within the prescribed Grant-in-Aid rules.
            </p>
            <br><br>
            <p>Thanking You.</p>
            <br><br>
            <div style="display: flex; justify-content: space-between; margin-top: 40px;">
              <div>Date: ______________</div>
              <div style="text-align: center;">
                ____________________________<br>
                Signature of Employee
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       FORM RENDERER
       ========================================================================= */
    function renderFormTab(rec) {
      return `
        <div style="max-width: 900px; margin: 0 auto;">
          <h2 style="margin-bottom: 20px; color: var(--primary);">Employee & Pension Details</h2>
          <form id="pensionForm" class="form-grid" onsubmit="event.preventDefault();">
            <div class="form-group">
              <label>Staff Name</label>
              <input type="text" class="form-control" name="staffName" value="${escapeHtml(rec.staffName)}">
            </div>
            
            <div class="form-group">
              <label>Gender</label>
              <select class="form-control" name="gender">
                <option value="M" ${rec.gender === "M" ? "selected" : ""}>Male</option>
                <option value="F" ${rec.gender === "F" ? "selected" : ""}>Female</option>
              </select>
            </div>

            <div class="form-group">
              <label>Designation</label>
              <input type="text" class="form-control" name="designation" value="${escapeHtml(rec.designation)}">
            </div>

            <div class="form-group">
              <label>Pay Scale / Level</label>
              <input type="text" class="form-control" name="payScale" value="${escapeHtml(rec.payScale)}">
            </div>

            <div class="form-group">
              <label>Basic Pay (Rs.)</label>
              <input type="text" class="form-control" name="basicPay" value="${escapeHtml(rec.basicPay)}">
            </div>

            <div class="form-group">
              <label>Pay As On Date</label>
              <input type="text" class="form-control" name="payAsOfDate" value="${escapeHtml(rec.payAsOfDate)}">
            </div>

            <div class="form-group">
              <label>Date of Superannuation (DOR)</label>
              <input type="text" class="form-control" name="dor" value="${escapeHtml(rec.dor)}">
            </div>

            <div class="form-group">
              <label>Last Increment Date</label>
              <input type="text" class="form-control" name="lastIncDate" value="${escapeHtml(rec.lastIncDate)}" ${rec.noIncDue ? "disabled" : ""}>
              <label class="checkbox-label" style="margin-top: 5px;">
                <input type="checkbox" name="noIncDue" ${rec.noIncDue ? "checked" : ""}> No increment due before retirement (NIL)
              </label>
            </div>

            <div class="form-group">
              <label>Spouse Name</label>
              <input type="text" class="form-control" name="spouseName" value="${escapeHtml(rec.spouseName)}">
            </div>

            <div class="form-group">
              <label>Spouse Occupation</label>
              <input type="text" class="form-control" name="spouseOccupation" value="${escapeHtml(rec.spouseOccupation)}">
            </div>
          </form>
        </div>
      `;
    }

    /* =========================================================================
       UI RENDER & EVENT HANDLERS
       ========================================================================= */
    function render() {
      // 1. Update Tabs Active State
      $$(".tab").forEach(t => {
        t.classList.toggle("active", t.dataset.tab === activeTab);
      });

      // 2. Render View Content
      const view = $("#contentView");
      if (activeTab === "form") {
        view.innerHTML = renderFormTab(current);
        bindFormEvents();
      } else if (activeTab === "payCert") {
        view.innerHTML = renderPayCertTab(current);
      } else if (activeTab === "hraCert") {
        view.innerHTML = renderHraCertTab(current);
      } else if (activeTab === "hraDecl") {
        view.innerHTML = renderHraDeclTab(current);
      }
    }

    function bindFormEvents() {
      const form = $("#pensionForm");
      if (!form) return;

      form.addEventListener("input", (e) => {
        const target = e.target;
        if (target.name === "noIncDue") {
          current.noIncDue = target.checked;
          if (target.checked) current.lastIncDate = "NIL";
        } else {
          current[target.name] = target.value;
        }
        dirty = true;
        
        // Re-sync disabled state of lastIncDate input
        const incInput = form.querySelector('[name="lastIncDate"]');
        if (incInput) {
          incInput.disabled = current.noIncDue;
          if (current.noIncDue) incInput.value = "NIL";
        }
      });
    }

    async function renderRecordList() {
      const listEl = $("#recordList");
      const ids = await loadIndex();
      const filter = $("#searchBox").value.toLowerCase();
      
      listEl.innerHTML = "";
      for (let id of ids) {
        const item = await loadRecordStorage(id);
        if (!item) continue;
        if (filter && !item.staffName.toLowerCase().includes(filter)) continue;

        const div = document.createElement("div");
        div.className = `record-item ${current.id === item.id ? "active" : ""}`;
        div.innerHTML = `
          <div class="name">${escapeHtml(item.staffName || "Unnamed")}</div>
          <div class="sub">${escapeHtml(item.designation)} | DOR: ${escapeHtml(item.dor)}</div>
        `;
        div.addEventListener("click", async () => {
          if (dirty && !confirm("Discard unsaved changes?")) return;
          current = item;
          originalSnapshot = JSON.stringify(current);
          dirty = false;
          render();
          renderRecordList();
        });
        listEl.appendChild(div);
      }
    }

    /* =========================================================================
       EVENT WIRING
       ========================================================================= */
    $$(".tab").forEach(t => t.addEventListener("click", () => {
      activeTab = t.dataset.tab;
      render();
    }));

    $("#btnPrintOne").addEventListener("click", () => window.print());

    $("#btnNew").addEventListener("click", () => {
      if (dirty && !confirm("Discard unsaved changes and start a new record?")) return;
      current = defaultRecord();
      originalSnapshot = JSON.stringify(current);
      dirty = false;
      activeTab = "form";
      render();
      renderRecordList();
    });

    $("#btnSave").addEventListener("click", async () => {
      if (!current.staffName) { alert("Please enter the employee's Name before saving."); return; }
      if (!current.id) current.id = newId();
      current.savedAt = new Date().toISOString();
      await saveRecord(current);
      
      const ids = await loadIndex();
      if (!ids.includes(current.id)) { ids.push(current.id); await saveIndex(ids); }
      
      originalSnapshot = JSON.stringify(current);
      dirty = false;
      await renderRecordList();
      render();
      flashStatus("Saved " + proper(current.staffName) + " successfully.", "ok");
    });

    $("#btnResetForm").addEventListener("click", () => {
      if (!confirm("Undo all unsaved changes on this record?")) return;
      current = JSON.parse(originalSnapshot);
      dirty = false;
      render();
    });

    $("#btnDuplicate").addEventListener("click", () => {
      current = JSON.parse(JSON.stringify(current));
      current.id = null;
      current.savedAt = null;
      current.staffName = current.staffName ? current.staffName + " (copy)" : "";
      dirty = true;
      originalSnapshot = JSON.stringify(defaultRecord());
      activeTab = "form";
      render();
    });

    $("#btnDelete").addEventListener("click", async () => {
      if (!current.id) return;
      if (!confirm("Delete this pensioner's record permanently?")) return;
      await deleteRecordStorage(current.id);
      current = defaultRecord();
      originalSnapshot = JSON.stringify(current);
      dirty = false;
      activeTab = "form";
      await renderRecordList();
      render();
    });

    $("#searchBox").addEventListener("input", renderRecordList);
    $("#btnToggleSidebar").addEventListener("click", () => {
      const sidebar = $(".sidebar");
      sidebar.style.display = sidebar.style.display === "none" ? "flex" : "none";
    });

    function flashStatus(msg, kind) {
      const el = $("#sideStatus");
      el.innerHTML = `<div class="status ${kind === 'ok' ? 'ok' : 'err'}">${escapeHtml(msg)}</div>`;
      setTimeout(() => { el.innerHTML = ""; }, 3500);
    }

    // Initialize Application
    (async function init() {
      await renderRecordList();
      render();
    })();
  </script>
</body>
</html>
