<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pension Application &amp; Certificate Generator</title>
<style>
  :root{
    --navy:#1b3a5c; --navy-dark:#122840; --gold:#a9772f; --paper:#fdfcf9;
    --line:#c7ccd1; --ink:#1c1c1c; --muted:#5b6570; --accent-bg:#eef3f7;
    --ok:#2e7d4f; --danger:#a4322a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#e9ecef;color:var(--ink);}
  .app{display:flex;min-height:100vh;}
  /* ---------- Sidebar ---------- */
  .sidebar{width:280px;flex:0 0 280px;background:var(--navy-dark);color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:14px;}
  .sidebar h1{font-size:16px;margin:0 0 2px;letter-spacing:.3px;}
  .sidebar .sub{font-size:11px;color:#9fb3c8;margin-bottom:6px;}
  .btn{cursor:pointer;border:none;border-radius:6px;padding:9px 12px;font-size:13px;font-weight:600;transition:.15s;}
  .btn-primary{background:var(--gold);color:#fff;}
  .btn-primary:hover{background:#8f611f;}
  .btn-ghost{background:transparent;color:#dce6ef;border:1px solid #3a5675;}
  .btn-ghost:hover{background:#20405f;}
  .btn-danger{background:transparent;color:#f2a29a;border:1px solid #6b3630;}
  .btn-danger:hover{background:#4a2320;}
  .btn-block{width:100%;}
  .rec-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:4px;}
  .rec-item{background:#20405f;border-radius:6px;padding:9px 10px;cursor:pointer;font-size:12.5px;border:1px solid transparent;}
  .rec-item:hover{border-color:var(--gold);}
  .rec-item.active{background:var(--gold);color:#fff;}
  .rec-item .nm{font-weight:600;display:block;}
  .rec-item .meta{font-size:10.5px;opacity:.8;}
  .search-box{width:100%;padding:8px 9px;border-radius:6px;border:1px solid #3a5675;background:#0f2438;color:#fff;font-size:12.5px;}
  .search-box::placeholder{color:#7d93a8;}
  .side-foot{font-size:10.5px;color:#7d93a8;line-height:1.5;border-top:1px solid #2c4a68;padding-top:10px;}
  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;}
  .topbar .title{font-weight:700;color:var(--navy);font-size:15px;flex:1;}
  .tabs{display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;overflow-x:auto;}
  .tab{padding:10px 14px;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;}
  .tab.active{color:var(--navy);border-color:var(--gold);}
  .content{flex:1;padding:22px;overflow-y:auto;}
  .status{font-size:12px;padding:6px 10px;border-radius:5px;}
  .status.ok{background:#e2f3e8;color:var(--ok);}
  .status.err{background:#fbe6e4;color:var(--danger);}
  /* ---------- Form ---------- */
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 18px;}
  fieldset{border:1px solid var(--line);border-radius:8px;padding:14px 16px 16px;margin:0 0 18px;background:#fff;}
  legend{font-size:13px;font-weight:700;color:var(--navy);padding:0 6px;}
  label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
  .field{margin-bottom:0;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:7px 8px;border:1px solid #c9cfd6;border-radius:5px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:44px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
  .hint{font-size:10.5px;color:#8a93a0;margin-top:2px;}
  .form-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;justify-content:flex-end;}
  /* ---------- Summary ---------- */
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
  .sum-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
  .sum-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .sum-card .val{font-size:18px;font-weight:700;color:var(--navy);margin-top:3px;}
  /* ---------- Documents list + preview ---------- */
  .doc-layout{display:flex;gap:18px;align-items:flex-start;}
  .doc-list{width:260px;flex:0 0 260px;display:flex;flex-direction:column;gap:6px;position:sticky;top:70px;}
  .doc-btn{text-align:left;background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--navy);}
  .doc-btn small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;margin-top:2px;}
  .doc-btn.active{border-color:var(--gold);background:#fff7ec;}
  .doc-preview-wrap{flex:1;min-width:0;}
  .preview-toolbar{display:flex;gap:8px;margin-bottom:10px;}
  /* ---------- Printable page ---------- */
  .page{background:var(--paper);width:210mm;min-height:296mm;margin:0 auto 24px;padding:16mm 16mm 14mm;box-shadow:0 1px 8px rgba(0,0,0,.18);font-family:"Times New Roman",Georgia,serif;font-size:11.5pt;line-height:1.45;color:#111;}
  .page h2.doc-title{text-align:center;font-size:14pt;font-weight:bold;margin:2mm 0 4mm;letter-spacing:.4px;}
  .page h3.doc-sub{text-align:center;font-size:11pt;margin:-3mm 0 5mm;font-weight:bold;}
  .page .ref-line{font-size:10.5pt;margin-bottom:4mm;}
  .page p{margin:0 0 3mm;text-align:justify;}
  .page .letterhead{text-align:center;margin-bottom:4mm;border-bottom:2px solid var(--navy);padding-bottom:3mm;}
  .page .letterhead .sc{font-size:14pt;font-weight:bold;color:var(--navy);}
  .page .letterhead .ad{font-size:10pt;color:#333;}
  .page .to-block{margin-bottom:4mm;}
  .page .sign-block{margin-top:10mm;}
  .page table{width:100%;border-collapse:collapse;margin:3mm 0;font-size:10pt;}
  .page table td, .page table th{border:1px solid #111;padding:4px 6px;vertical-align:top;}
  .page table th{background-color:#f2f2f2;font-weight:bold;text-align:center;}
  .page ol.items{padding-left:18px;margin:0 0 3mm;}
  .page ol.items li{margin-bottom:2.5mm;text-align:justify;}
  .page .blank{border-bottom:1px solid #333;display:inline-block;min-width:60px;}
  .page .encl{font-size:11pt;}
  .page .small{font-size:10pt;color:#333;}
  .page .center{text-align:center;}
  .page .right{text-align:right;}
  .page .sig-line{margin-top:14mm;border-top:1px solid #222;width:70mm;padding-top:2mm;font-size:10.5pt;}
  .page .field-empty{color:#b33;font-style:italic;}
  
  /* Strict table styles for statutory forms */
  .pension-table th { font-size: 9pt; line-height: 1.2; padding: 4px 2px; text-align: center; }
  .pension-table td { font-size: 9.5pt; padding: 5px 4px; }
  
  /* ---------- Mobile friendliness ---------- */
  .sidebar-toggle{display:none;}
  @media (max-width: 860px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex:0 0 auto;max-height:0;overflow:hidden;padding:0 14px;transition:max-height .2s ease, padding .2s ease;}
    .sidebar.open{max-height:70vh;overflow-y:auto;padding:14px;}
    .sidebar-toggle{display:flex;align-items:center;gap:6px;}
    .content{padding:14px;}
    .form-grid{grid-template-columns:1fr;}
    .doc-layout{flex-direction:column;}
    .doc-list{width:100%;flex:0 0 auto;position:static;flex-direction:row;flex-wrap:wrap;}
    .doc-btn{flex:1 1 auto;min-width:140px;}
    .page{width:100%;max-width:210mm;transform-origin:top left;padding:10mm;font-size:11.5pt;}
  }
  @media print{
    body *{visibility:hidden;}
    .print-area, .print-area *{visibility:visible;}
    .print-area{position:absolute;left:0;top:0;width:100%;}
    .page{box-shadow:none;margin:0;page-break-after:always;}
    .page:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div>
      <h1>Pension Portal</h1>
      <div class="sub">e-Pension Application &amp; Certificate Generator</div>
    </div>
    <button class="btn btn-primary btn-block" id="btnNew">+ New Pensioner Record</button>
    <input class="search-box" id="searchBox" placeholder="Search saved records...">
    <div class="rec-list" id="recList"></div>
    <div id="sideStatus"></div>
    <div class="side-foot">Data is stored privately for your account and stays available across sessions. Nothing is shared with other users.</div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="btn btn-ghost sidebar-toggle" id="btnToggleSidebar">☰ Records</button>
      <div class="title" id="topTitle">New Pensioner Record</div>
      <button class="btn btn-ghost" id="btnDuplicate" style="display:none;">Duplicate as New</button>
      <button class="btn btn-danger" id="btnDelete" style="display:none;">Delete Record</button>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="form">1. Enter Data</div>
      <div class="tab" data-tab="summary">2. Computed Summary</div>
      <div class="tab" data-tab="docs">3. Documents / Print</div>
    </div>
    <div class="content" id="content"></div>
    <div class="form-actions" id="formActions" style="display:none;">
      <span id="saveStatus" style="align-self:center;font-size:12px;color:var(--muted);"></span>
      <button class="btn btn-ghost" id="btnResetForm">Undo Changes</button>
      <button class="btn btn-primary" id="btnSave">Save Record</button>
    </div>
  </div>

</div>

<script>
/* =========================================================================
   FIELD SCHEMA  (mirrors the DATA sheet of the original workbook)
   ========================================================================= */
const DESIGNATIONS = ["ASSISTANT TEACHER","CLERK","GR-D STAFF","HEADMASTER","HEADMISTRESS","AHM","LIBRARIAN","TEACHER-IN-CHARGE"];
const GRADE_PAYS = [
  {gp:1700, level:"LEVEL-1-PB-1:4900-16200-GP-RS-1700"},
  {gp:1800, level:"LEVEL-2-PB-1:4900-16200-GP-RS-1800"},
  {gp:2600, level:"LEVEL-6-PB-2-5400-25200- GP-RS-2600"},
  {gp:2900, level:"LEVEL-7-PB-2-.5400-25200- GP-RS-2900"},
  {gp:3900, level:"LEVEL-10-PB-3-7100-37600-GP-RS-3900"},
  {gp:4100, level:"LEVEL-11-PB-3-7100-37600-GP-RS-4100"},
  {gp:4400, level:"LEVEL-12-PB-4-9000-40500-GP-RS-4400"},
  {gp:4700, level:"LEVEL-14-PB-4-9000-40500-GP-RS-4700"},
  {gp:4800, level:"LEVEL-15-PB-4-9000-40500-GP-RS-4800"},
  {gp:5400, level:"LEVEL-16-PB-4-9000-40500-GP-RS-5400"}
];
const ADMIN_STATUSES = ["President [M.C.]","Member Secretary [Ad-hoc Committee]","Administrator","Secretary [M.C.]"];
const CHARGE_CAUSES = ["Superannuation Retirement  From Service","Resignation from the Post of Teacher-In-Charge / H.M.","Others"];

const SECTIONS = [
{
  title:"School Information",
  fields:[
    {id:"schoolName", label:"School Name", type:"text"},
    {id:"schoolAddress", label:"School Address", type:"textarea"},
    {id:"schoolSubDiv", label:"Sub-Division", type:"select", options:["KHATRA","BANKURA","BISHNUPUR"]},
    {id:"schoolRecognisedDate", label:"School Recognised W.E.F.", type:"date"},
    {id:"schoolMail", label:"School e-Mail ID", type:"text"},
    {id:"hoiMobile", label:"HOI Mobile No.", type:"text"},
    {id:"currentUserId", label:"Current User ID (School, e-Pension)", type:"text"},
    {id:"diseCode", label:"DISE / UDISE Code of School", type:"text"},
    {id:"treasury", label:"Treasury", type:"text"}
  ]
},
{
  title:"Employee Details",
  fields:[
    {id:"staffName", label:"Name of the Staff", type:"text"},
    {id:"gender", label:"Sex", type:"select", options:["MALE","FEMALE"]},
    {id:"designation", label:"Designation", type:"select", options:DESIGNATIONS},
    {id:"employeeCode", label:"Employee Code", type:"text"},
    {id:"applicationId", label:"Application ID", type:"text"},
    {id:"employeeMobile", label:"Employee Mobile No.", type:"text"},
    {id:"dob", label:"Date of Birth", type:"date"},
    {id:"lastGradePay", label:"Last Grade Pay", type:"select", options:GRADE_PAYS.map(g=>String(g.gp))}
  ]
},
{
  title:"Service History",
  fields:[
    {id:"prevSchool1", label:"Previous School - 1 (earliest)", type:"text"},
    {id:"prevSchool2", label:"Previous School - 2 (if any)", type:"text"},
    {id:"dojFirst", label:"Date of First Joining (Service)", type:"date", hint:"Start of service at Previous School-1. If there was no previous school at all, set this equal to 'DOJ in this School'."},
    {id:"dojPrevSchool2", label:"Date of Joining Previous School-2", type:"date", hint:"Leave equal to 'DOJ in this School' if there was only ONE previous school. Leave blank/same as first-joining if there was NO previous school."},
    {id:"dojThisSchool", label:"DOJ in this (current) School", type:"date"},
    {id:"prevSchoolPost1", label:"Post Held at Previous School - 1", type:"select", options:DESIGNATIONS},
    {id:"prevSchoolPost2", label:"Post Held at Previous School - 2", type:"select", options:DESIGNATIONS},
    {id:"medicalLeave", label:"Medical Leave Enjoyed (days)", type:"text"},
    {id:"halfPayLeave", label:"Half Pay Leave (days)", type:"text"},
    {id:"extraOrdinaryLeave", label:"Extra Ordinary Leave (days)", type:"text"},
    {id:"specialLeave", label:"Special Leave (days)", type:"text"},
    {id:"hraOverdrawn", label:"HRA / Salary Overdrawn, if any (Rs.)", type:"number"},
    {id:"challanNoDate", label:"Challan No. &amp; Date (if refunded)", type:"text"}
  ]
},
{
  title:"Pay &amp; Pension Inputs",
  fields:[
    {id:"lastBasicPay", label:"Last (Final) Basic Pay (Rs.)", type:"number", hint:"The final basic pay used for pension/gratuity — i.e. AFTER the last applicable 1st-July increment, if any."},
    {id:"lastButBasicPay", label:"Basic Pay Before Last Increment (Rs.)", type:"number", hint:"The basic pay as currently drawn, BEFORE the 1st-July increment referenced below. Same as Last Basic Pay if no further increment falls due before retirement."},
    {id:"lastIncrementDate", label:"Date of Last/Next 1st-July Increment", type:"date", hint:"Leave blank or equal to the increment-before date if no increment falls due before the date of retirement."},
    {id:"daPercent", label:"D.A. @ (%)", type:"number"},
    {id:"hraMode", label:"HRA Type", type:"select", options:["PERCENT","FIXED"], hint:"Choose PERCENT to enter a rate below, or FIXED to enter a flat amount."},
    {id:"hraPercentValue", label:"HRA Rate (%), if PERCENT", type:"number", hint:"e.g. 12 or 15 — only used when HRA Type is PERCENT."},
    {id:"hraFixedAmount", label:"Fixed HRA Amount (Rs.), if FIXED", type:"number", hint:"e.g. 3600 — only used when HRA Type is FIXED. Enter your school's actual fixed HRA."},
    {id:"commutationPercent", label:"Commutation (%) e.g. 0.4 = 40%", type:"number"},
    {id:"ppoNo", label:"PPO No.", type:"text"},
    {id:"ppoMemo", label:"PPO Memo No. &amp; Date", type:"text"},
    {id:"pfGross", label:"PF Gross (Rs.)", type:"number"}
  ]
},
{
  title:"Spouse Details",
  fields:[
    {id:"spouseName", label:"Spouse Name", type:"text"},
    {id:"spouseRelation", label:"Spouse Relation", type:"select", options:["WIFE","HUSBAND"]},
    {id:"spouseStatus", label:"Spouse Status", type:"select", options:["IN SERVICE","HOUSEWIFE","UN MARRIED","NOT IN SERVICE"]},
    {id:"spouseOffice", label:"Spouse Office Name &amp; Address (if in service)", type:"textarea"},
    {id:"spouseDept", label:"Spouse Department (if in service)", type:"text"},
    {id:"spouseDoj", label:"Spouse Date of Joining (if in service)", type:"date"},
    {id:"spouseDesignation", label:"Spouse Designation (if in service)", type:"text"},
    {id:"spouseDob", label:"Spouse Date of Birth", type:"date"},
    {id:"selfSpouseAddress", label:"Self / Spouse Residential Address", type:"textarea"},
    {id:"spouseBankName", label:"Spouse Bank Name", type:"text"},
    {id:"spouseBranchName", label:"Spouse Bank Branch", type:"text"},
    {id:"spouseAccountNo", label:"Spouse Account No.", type:"text"}
  ]
},
{
  title:"Children (Nominees)",
  fields:[
    {id:"child1Name", label:"Child 1 - Name", type:"text"},
    {id:"child1Relation", label:"Child 1 - Relation", type:"select", options:["SON","DAUGHTER"]},
    {id:"child1Dob", label:"Child 1 - Date of Birth", type:"date"},
    {id:"child1GratuityShare", label:"Child 1 - Gratuity Share % (optional)", type:"number", hint:"Leave blank to split evenly among children entered."},
    {id:"child2Name", label:"Child 2 - Name", type:"text"},
    {id:"child2Relation", label:"Child 2 - Relation", type:"select", options:["SON","DAUGHTER"]},
    {id:"child2Dob", label:"Child 2 - Date of Birth", type:"date"},
    {id:"child2GratuityShare", label:"Child 2 - Gratuity Share % (optional)", type:"number"},
    {id:"child3Name", label:"Child 3 - Name", type:"text"},
    {id:"child3Relation", label:"Child 3 - Relation", type:"select", options:["SON","DAUGHTER"]},
    {id:"child3Dob", label:"Child 3 - Date of Birth", type:"date"},
    {id:"child3GratuityShare", label:"Child 3 - Gratuity Share % (optional)", type:"number"}
  ]
},
{
  title:"Charge Hand-over / Administrative",
  fields:[
    {id:"hoiStatus", label:"HOI Status (post used for signature)", type:"select", options:DESIGNATIONS},
    {id:"adminStatus", label:"Administrative Status (M.C. post)", type:"select", options:ADMIN_STATUSES},
    {id:"chargeHandOverCause", label:"Reason for Charge Hand-over", type:"select", options:CHARGE_CAUSES},
    {id:"chargeHandOverToName", label:"Incoming Officer - Name", type:"text"},
    {id:"chargeHandOverToPost", label:"Incoming Officer - Post", type:"select", options:DESIGNATIONS},
    {id:"chargeHandOverDate", label:"Charge Hand-over Date of Execution", type:"date"},
    {id:"ticChargeFrom", label:"T.I.C. Charge From (existing user-id date)", type:"date"},
    {id:"cpcName", label:"CPC Name / Address (Circle Project Co-ordinator)", type:"text"}
  ]
}
];

function defaultRecord(){
  const d = {id:null, savedAt:null};
  SECTIONS.forEach(sec=>sec.fields.forEach(f=>{ d[f.id] = f.type==="number" ? "" : ""; }));
  d.gender = "MALE";
  d.hraMode = "PERCENT";
  d.hraPercentValue = "12";
  d.hraFixedAmount = "3600";
  d.spouseRelation = "WIFE";
  d.spouseStatus = "HOUSEWIFE";
  d.child1Relation = "SON"; d.child2Relation="SON"; d.child3Relation="SON";
  d.chargeHandOverCause = CHARGE_CAUSES[0];
  d.chargeHandOverToPost = "TEACHER-IN-CHARGE";
  return d;
}

/* =========================================================================
   HELPERS  (Excel-formula equivalents)
   ========================================================================= */
function proper(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[A-Za-z]+/g, w => w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());
}
function upper(s){ return s? String(s).toUpperCase() : ""; }
function toDate(s){
  if(!s) return null;
  const parts = String(s).split("-");
  if(parts.length!==3) return null;
  const y=+parts[0], m=+parts[1], d=+parts[2];
  if(!y||!m||!d) return null;
  return new Date(y, m-1, d);
}
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtD(d, pattern){
  if(!d) return "";
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yyyy = d.getFullYear();
  switch(pattern){
    case "dd-mmmm-yyyy": return `${dd}-${MONTHS[d.getMonth()]}-${yyyy}`;
    case "dd-mmm-yyyy": return `${dd}-${MONTHS[d.getMonth()].slice(0,3)}-${yyyy}`;
    case "mmmm d,yyyy": return `${MONTHS[d.getMonth()]} ${d.getDate()},${yyyy}`;
    default: return `${dd}-${mm}-${yyyy}`;
  }
}
function fmtDate(s, pattern){ return fmtD(toDate(s), pattern); }
function minusDays(dateStr, n){ const d = toDate(dateStr); return d ? addDays(d, -n) : null; }
function addDays(d, n){ const r=new Date(d.getTime()); r.setDate(r.getDate()+n); return r; }
function excelDateK0(year, k){ return new Date(year, k, 0); }
function calcSuperannuation(dobStr){
  const dob = toDate(dobStr);
  if(!dob) return null;
  const y = dob.getFullYear()+60;
  const em = dob.getMonth()+1;
  if(dob.getDate()===1) return excelDateK0(y, em-1);
  return excelDateK0(y, em);
}
function dateDiffY(start,end){
  if(!start||!end) return 0;
  let y = end.getFullYear()-start.getFullYear();
  const m = end.getMonth()-start.getMonth();
  const d = end.getDate()-start.getDate();
  if(m<0 || (m===0 && d<0)) y--;
  return Math.max(y,0);
}
function dateDiffYM(start,end){
  if(!start||!end) return 0;
  let m = end.getMonth()-start.getMonth();
  if(end.getDate()<start.getDate()) m--;
  m = ((m%12)+12)%12;
  return m;
}
function dateDiffMD(start,end){
  if(!start||!end) return 0;
  let d = end.getDate()-start.getDate();
  if(d<0){
    const prevMonthLastDay = new Date(end.getFullYear(), end.getMonth(), 0).getDate();
    d += prevMonthLastDay;
  }
  return d;
}
function ageString(dobStr, asOf){
  const dob = toDate(dobStr);
  const ref = asOf || new Date();
  if(!dob) return "";
  return `${dateDiffY(dob,ref)}`;
}
function inr(n){
  if(n===null||n===undefined||n==="" ||isNaN(n)) return "";
  n = Math.round(Number(n));
  const neg = n<0; n=Math.abs(n);
  let s = String(n);
  let last3 = s.slice(-3);
  let rest = s.slice(0,-3);
  if(rest!=="") last3 = ","+last3;
  const formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + last3;
  return (neg?"-":"") + formatted;
}
function heShe(g){ return g==="MALE" ? "He":"She"; }
function heshe(g){ return g==="MALE" ? "he":"she"; }
function himHer(g){ return g==="MALE" ? "him":"her"; }
function hisHer(g){ return g==="MALE" ? "his":"her"; }
function HisHer(g){ return g==="MALE" ? "His":"Her"; }
function wifeHusband(g){ return g==="MALE" ? "wife":"husband"; }
function blank(txt){ return txt && String(txt).trim() ? txt : '<span class="field-empty">[not provided]</span>'; }
function safe(txt){ return (txt===undefined||txt===null) ? "" : txt; }

/* =========================================================================
   COMPUTE  -  replicates DATA sheet's internal formulas (I13..I27 etc.)
   ========================================================================= */
function compute(t){
  const c = {};
  c.dor = calcSuperannuation(t.dob);
  c.dorStr = c.dor ? `${c.dor.getFullYear()}-${String(c.dor.getMonth()+1).padStart(2,"0")}-${String(c.dor.getDate()).padStart(2,"0")}` : "";
  c.spouseDor = calcSuperannuation(t.spouseDob);

  const doj = toDate(t.dojFirst);
  c.serviceY = doj && c.dor ? dateDiffY(doj, c.dor) : 0;
  c.serviceYM = doj && c.dor ? dateDiffYM(doj, c.dor) : 0;
  c.serviceMD = doj && c.dor ? (1+dateDiffMD(doj, c.dor)) : 0;
  c.totalLengthOfService = doj && c.dor ? `${c.serviceY}Y-${c.serviceYM}M-${c.serviceMD}-D` : "";

  const bonus = c.serviceYM>=9 ? 3 : c.serviceYM>=6 ? 2 : c.serviceYM>=3 ? 1 : 0;
  c.qualHalfYears = Math.min((bonus + c.serviceY*2)/2, 33);

  const lastBasic = Number(t.lastBasicPay)||0;
  c.lastBasicReckonable = lastBasic;
  const da = Number(t.daPercent)||0;
  c.daAmount = Math.round(lastBasic*da/100);
  c.reckonableGratuity = c.lastBasicReckonable + c.daAmount;
  c.gratuityAmount = Math.min(c.reckonableGratuity*c.qualHalfYears/2, 1200000);
  c.commutationPct = Number(t.commutationPercent)||0;
  c.reckonablePension = c.lastBasicReckonable * Math.min(c.qualHalfYears,20)/20;
  c.pensionBasic = c.qualHalfYears<10 ? 0 : (c.qualHalfYears<20 ? Math.round((c.lastBasicReckonable/2)*(c.qualHalfYears/20)) : Math.round(c.lastBasicReckonable/2));
  c.commutationAmount = Math.round(c.pensionBasic*c.commutationPct);
  c.cvpAmount = Math.round(c.commutationAmount*8.194*12);
  c.retirementTotalOneTime = c.gratuityAmount + c.cvpAmount;
  c.pfGross = Number(t.pfGross)||0;
  c.totalDuringRetirement = c.retirementTotalOneTime + c.pfGross;
  c.deficitCrorepati = 10000000 - c.totalDuringRetirement;
  c.monthlyPension = Math.round(c.pensionBasic) + Math.round(c.pensionBasic*da/100) + 500 - c.commutationAmount;

  const gpRow = GRADE_PAYS.find(g=>String(g.gp)===String(t.lastGradePay));
  c.payLevel = gpRow ? gpRow.level : "";

  c.hraAmount = (String(t.hraMode).toUpperCase()==="FIXED") ? (Number(t.hraFixedAmount)||3600) : Math.round((Number(t.lastButBasicPay)||0)*(Number(t.hraPercentValue)||0)/100);

  c.child1Age = t.child1Dob ? ageString(t.child1Dob, c.dor) : "";
  c.child2Age = t.child2Dob ? ageString(t.child2Dob, c.dor) : "";
  c.child3Age = t.child3Dob ? ageString(t.child3Dob, c.dor) : "";

  c.isResignation = t.chargeHandOverCause && t.chargeHandOverCause.indexOf("Resignation")===0;
  c.chargeExecDate = toDate(t.chargeHandOverDate);
  c.chargeExecDatePlus1 = c.chargeExecDate ? addDays(c.chargeExecDate,1) : null;
  c.dorPlus1 = c.dor ? addDays(c.dor,1) : null;

  return c;
}

    t.child3Name ? {name:proper(t.child3Name), rel:proper(t.child3Relation), dob:t.child3Dob, share:t.child3GratuityShare} : null
  ].filter(Boolean);

  const rowCount = Math.max(alternates.length, 1);
  const anyShareEntered = alternates.some(a => a.share!==undefined && a.share!==null && a.share!=="");
  const equalShare = alternates.length ? Math.round(100/alternates.length) : 0;
  const rows = [];

  for(let i=0; i<rowCount; i++){
    const alt = alternates[i];
    const sharePct = alt ? (anyShareEntered ? (Number(alt.share)||0) : equalShare) : 0;
    let row = "<tr>";
    if(i===0){
      row += `<td rowspan="${rowCount}" style="width:22%;"><strong>(1)</strong> ${blank(proper(t.spouseName))}<br><span style="font-size:8.5pt;">${blank(proper(t.selfSpouseAddress))}</span></td>`;
      row += `<td rowspan="${rowCount}" style="width:10%;" class="center">${blank(proper(t.spouseRelation))}</td>`;
      row += `<td rowspan="${rowCount}" style="width:7%;" class="center">${t.spouseDob ? ageString(t.spouseDob, c.dor) : ""}</td>`;
      row += `<td rowspan="${rowCount}" style="width:11%;" class="center">100%</td>`;
      row += `<td rowspan="${rowCount}" style="width:12%;" class="center">Death / Invalidity</td>`;
    }
    row += `<td style="width:26%;">${alt ? `<strong>(${i+2})</strong> ${blank(alt.name)}<br><span style="font-size:8.5pt;">${blank(proper(t.selfSpouseAddress))}</span>` : ""}</td>`;
    row += `<td style="width:12%;" class="center">${alt ? `${sharePct}% (Rs. ${inr((c.gratuityAmount * sharePct)/100)})` : ""}</td>`;
    row += "</tr>";
    rows.push(row);
  }

  return pageWrap(`
    <div style="font-family:'Times New Roman', Georgia, serif; font-size:11.3pt; line-height:1.45;">
      <div style="text-align:right; font-weight:bold; font-size:12pt; margin-bottom:5px;">Enclosure &mdash; &lsquo;D&rsquo;</div>
      <h2 class="doc-title" style="margin: 0 0 2px 0;">Nomination for Payment of Death-Cum-Retirement Gratuity</h2>
      <h3 class="doc-sub" style="margin: 0 0 12px 0; font-weight:normal;">(To be furnished by the Employee)</h3>
      
      <p style="text-align:justify; margin-bottom:12px;">
        I hereby nominate the person mentioned below, who are members of my family, and confer on them the right to receive, to the extent specified below, any gratuity that may be sanctioned by Government in the event of my death while in service and the right to receive on my death, to the extent specified below, any gratuity which having become admissible to me on retirement may remain unpaid at my death:
      </p>

      <table class="pension-table" style="width:100%; margin-bottom:15px;">
        <thead>
          <tr>
            <th>Name and address of nominees</th>
            <th>Relationship with employee</th>
            <th>Age</th>
            <th>Amount of Share of gratuity payable to each</th>
            <th>Contingencies on the happening of which the nomination shall become invalid</th>
            <th>Name, address and relationship of the person or persons, if any, to whom the right conferred on the nominee shall pass in the event of the nominee pre-deceasing the employee or the nominee dying after the death of the employee but before receiving payment of the gratuity</th>
            <th>Amount of share of gratuity payable to each Rs. P.</th>
          </tr>
          <tr style="font-size:8.5pt;" class="center">
            <td>(1)</td><td>(2)</td><td>(3)</td><td>(4)</td><td>(5)</td><td>(6)</td><td>(7)</td>
          </tr>
        </thead>
        <tbody>
          ${rows.join("")}
        </tbody>
      </table>

      <p style="margin-bottom:12px;">This nomination supersedes the nomination made by me earlier on ____________________ which stands cancelled.</p>
      
      <p style="margin-bottom:20px;">Dated this <strong class="blank" style="min-width:60px;">${c.dor?String(c.dor.getDate()):""}</strong> day of <strong class="blank" style="min-width:100px;">${c.dor?MONTHS[c.dor.getMonth()]:""}</strong> 20<strong class="blank" style="min-width:40px;">${c.dor?String(c.dor.getFullYear()).slice(2):""}</strong> at <strong class="blank" style="min-width:200px;">${proper(blank(t.schoolName))}</strong></p>

      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-top:25px;">
        <div style="width:50%;">
          <p style="margin-bottom:4px;">Witness to Signature :</p>
          <div style="border-bottom:1px solid #333; height:8mm; width:70mm; margin-bottom:6px;">(1)</div>
          <div style="border-bottom:1px solid #333; height:8mm; width:70mm; margin-bottom:15px;">(2)</div>
          
          <div style="font-size:9pt; line-height:1.3; color:#222; margin-top:15px;">
            <strong>Note :</strong><br>
            (1) The employee shall draw lines across the blank space below the last entry to prevent the insertion of any name after he has signed.<br>
            (2) Fourth column should be filled in so as to cover the whole amount of gratuity.<br>
            (3) The amount / share of gratuity shown in last column to cover the whole amount / share payable to the original nominee.<br>

}

const DOC_RENDERERS = {
  COVER: docCOVER, SB: docSB, AB: docAB, E: docE, D: docD,
  HRAD: docHRAD, HRAC: docHRAC, NOLIA: docNOLIA, PAYC: docPAYC,
  FLP: docFLP, FLCHO: docFLCHO, APPNOLIA: docAPPNOLIA,
  FLNOLIACPC: docFLNOLIACPC, FLNOLIA: docFLNOLIA, NOLIACERT: docNOLIACERT,
  RESC: docRESC, CHO: docCHO, CPC: docCPC
};

/* =========================================================================
   STORAGE
   ========================================================================= */
const INDEX_KEY = "pensioners:index";
async function loadIndex(){
  try{
    const r = await window.storage.get(INDEX_KEY);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveIndex(ids){
  await window.storage.set(INDEX_KEY, JSON.stringify(ids));
}
async function loadRecord(id){
  try{
    const r = await window.storage.get("pensioner:"+id);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveRecord(rec){
  await window.storage.set("pensioner:"+rec.id, JSON.stringify(rec));
}
async function deleteRecordStorage(id){
  try{ await window.storage.delete("pensioner:"+id); }catch(e){}
  const ids = (await loadIndex()).filter(x=>x!==id);
  await saveIndex(ids);
}

/* =========================================================================
   APP STATE
   ========================================================================= */
let allRecords = [];
let current = defaultRecord();
let originalSnapshot = JSON.stringify(current);
let activeTab = "form";
let activeDoc = "COVER";
let dirty = false;

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function newId(){ return "p_"+Date.now()+"_"+Math.random().toString(36).slice(2,8); }

async function refreshRecordList(){
  const ids = await loadIndex();
  const recs = [];
  for(const id of ids){
    const r = await loadRecord(id);
    if(r) recs.push(r);
  }
  recs.sort((a,b)=> (b.savedAt||"").localeCompare(a.savedAt||""));
  allRecords = recs;
  renderRecordList();
}
function renderRecordList(){
  const q = ($("#searchBox").value||"").toLowerCase();
  const list = $("#recList");
  const filtered = allRecords.filter(r => !q || (r.staffName||"").toLowerCase().includes(q) || (r.employeeCode||"").toLowerCase().includes(q) || (r.schoolName||"").toLowerCase().includes(q));
  list.innerHTML = filtered.map(r => `
    <div class="rec-item ${current.id===r.id?'active':''}" data-id="${r.id}">
      <span class="nm">${escapeHtml(proper(r.staffName)||"(unnamed)")}</span>
      <span class="meta">${escapeHtml(r.designation||"")} · ${escapeHtml(proper(r.schoolName)||"")}</span>
    </div>`).join("") || `<div class="meta" style="color:#8fa5ba;padding:8px 4px;">No saved records yet.</div>`;
  $$(".rec-item").forEach(el => el.addEventListener("click", ()=> selectRecord(el.dataset.id)));
}
function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

async function selectRecord(id){
  if(dirty && !confirm("You have unsaved changes on the current record. Discard them and switch?")) return;
  const r = await loadRecord(id);
  if(!r) return;
  current = r;
  originalSnapshot = JSON.stringify(current);
  dirty = false;
  activeTab = "form";
  render();
}

function render(){
  $("#topTitle").textContent = current.id ? (proper(current.staffName)||"(unnamed)") + " — " + (current.designation||"") : "New Pensioner Record";
  $("#btnDuplicate").style.display = current.id ? "inline-block" : "none";
  $("#btnDelete").style.display = current.id ? "inline-block" : "none";
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===activeTab));
  $("#formActions").style.display = activeTab==="form" ? "flex" : "none";
  renderRecordList();

  const content = $("#content");
  if(activeTab==="form") content.innerHTML = renderForm();
  else if(activeTab==="summary") content.innerHTML = renderSummary();
  else content.innerHTML = renderDocs();

  if(activeTab==="form") wireFormInputs();
  if(activeTab==="docs") wireDocButtons();
  updateSaveStatus();
}

function renderForm(){
  return SECTIONS.map(sec => `
    <fieldset>
      <legend>${sec.title}</legend>
      <div class="form-grid">
        ${sec.fields.map(f => renderField(f)).join("")}
      </div>
    </fieldset>
  `).join("") + renderLiveDorHint();
}
function renderLiveDorHint(){
  const c = compute(current);
  return `<div class="sum-card" style="max-width:320px;"><div class="lbl">Auto-computed Date of Retirement</div><div class="val" style="font-size:15px;">${c.dor ? fmtDate(c.dorStr,"dd-mmmm-yyyy") : "Enter Date of Birth"}</div></div>`;
}
function renderField(f){
  const val = current[f.id]===undefined ? "" : current[f.id];
  let input;
  if(f.type==="select"){
    input = `<select data-field="${f.id}"><option value="">-- select --</option>${f.options.map(o=>`<option value="${escapeHtml(o)}" ${String(val)===String(o)?"selected":""}>${escapeHtml(o)}</option>`).join("")}</select>`;
  } else if(f.type==="textarea"){
    input = `<textarea data-field="${f.id}">${escapeHtml(val)}</textarea>`;
  } else {
    input = `<input type="${f.type}" data-field="${f.id}" value="${escapeHtml(val)}">`;
  }
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : "";
  return `<div class="field"><label>${f.label}</label>${input}${hint}</div>`;
}
function wireFormInputs(){
  $$("[data-field]").forEach(el=>{
    el.addEventListener("input", ()=>{
      current[el.dataset.field] = el.value;
      dirty = true;
      updateSaveStatus();
      const hint = $("#content .sum-card .val");
      if(hint){ const c = compute(current); hint.textContent = c.dor ? fmtDate(c.dorStr,"dd-mmmm-yyyy") : "Enter Date of Birth"; }
    });
    el.addEventListener("change", ()=>{
      current[el.dataset.field] = el.value;
      dirty = true; updateSaveStatus();
    });
  });
}
function updateSaveStatus(){
  const el = $("#saveStatus");
  if(!el) return;
  el.textContent = dirty ? "Unsaved changes" : (current.id ? "All changes saved" : "");
  el.style.color = dirty ? "#a4322a" : "#2e7d4f";
}

function renderSummary(){
  const c = compute(current);
  const cards = [
    ["Date of Retirement", c.dor?fmtDate(c.dorStr,"dd-mm-yyyy"):"—"],
    ["Total Length of Service", c.totalLengthOfService || "—"],
    ["Qualifying Service (half-years)", c.qualHalfYears || 0],
    ["Reckonable Emoluments (Gratuity)", "Rs. "+ (inr(c.reckonableGratuity)||0)],
    ["Gratuity Amount", "Rs. "+(inr(c.gratuityAmount)||0)],
    ["Reckonable Emoluments (Pension)", "Rs. "+(inr(c.reckonablePension)||0)],
    ["Pension Basic", "Rs. "+(inr(c.pensionBasic)||0)],
    ["Commutation Amount", "Rs. "+(inr(c.commutationAmount)||0)],
    ["Commuted Value of Pension (CVP)", "Rs. "+(inr(c.cvpAmount)||0)],
    ["Retirement Total (One-Time)", "Rs. "+(inr(c.retirementTotalOneTime)||0)],
    ["Total incl. PF Gross", "Rs. "+(inr(c.totalDuringRetirement)||0)],
    ["Net Monthly Pension (Basic + DA + MA 500 − Commuted)", "Rs. "+(inr(c.monthlyPension)||0)],
    ["Pay Level / Scale", c.payLevel || "—"],
    ["HRA Amount", "Rs. "+(inr(c.hraAmount)||0)]
  ];
  return `<div class="summary-grid">` + cards.map(([l,v])=>`<div class="sum-card"><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join("") + `</div>
  <p class="hint" style="margin-top:14px;">These figures are calculated automatically from the data you entered, using the same formulas as the original workbook (ROPA-19 gratuity &amp; pension rules). Values update live as you edit the Data tab.</p>`;
}

function renderDocs(){
  const c = compute(current);
  const activeRenderer = DOC_RENDERERS[activeDoc];
  const html = activeRenderer ? activeRenderer(current, c) : "";
  return `
  <div class="doc-layout">
    <div class="doc-list">
      ${DOC_LIST.map(d=>`<button class="doc-btn ${activeDoc===d.id?'active':''}" data-doc="${d.id}">${d.name}<small>${d.sub}</small></button>`).join("")}
      <button class="btn btn-primary" style="margin-top:10px;" id="btnPrintAll">Print All Documents</button>
    </div>
    <div class="doc-preview-wrap">
      <div class="preview-toolbar">
        <button class="btn btn-ghost" id="btnPrintOne">Print This Document</button>
      </div>
      <div class="print-area" id="printArea">${html}</div>
    </div>
  </div>`;
}
function wireDocButtons(){
  $$(".doc-btn").forEach(b=>b.addEventListener("click", ()=>{ activeDoc=b.dataset.doc; render(); }));
  const one = $("#btnPrintOne");
  if(one) one.addEventListener("click", ()=> window.print());
  const all = $("#btnPrintAll");
  if(all) all.addEventListener("click", ()=>{
    const c = compute(current);
    const area = $("#printArea");
    area.innerHTML = DOC_LIST.map(d => DOC_RENDERERS[d.id](current,c)).join("");
    setTimeout(()=>{ window.print(); render(); }, 50);
  });
}

/* =========================================================================
   EVENT WIRING
   ========================================================================= */
$$(".tab").forEach(t=>t.addEventListener("click", async ()=>{
  activeTab = t.dataset.tab;
  render();
}));

$("#btnNew").addEventListener("click", async ()=>{
  if(dirty && !confirm("Discard unsaved changes and start a new record?")) return;
  current = defaultRecord();
  originalSnapshot = JSON.stringify(current);
  dirty = false;
  activeTab = "form";
  render();
});

$("#btnSave").addEventListener("click", async ()=>{
  if(!current.staffName){ alert("Please enter the employee's Name of the Staff before saving."); return; }
  if(!current.id) current.id = newId();
  current.savedAt = new Date().toISOString();
  await saveRecord(current);
  const ids = await loadIndex();
  if(!ids.includes(current.id)){ ids.push(current.id); await saveIndex(ids); }
  originalSnapshot = JSON.stringify(current);
  dirty = false;
  await refreshRecordList();
  render();
  flashStatus("Saved "+ (proper(current.staffName)) + " successfully.", "ok");
});

$("#btnResetForm").addEventListener("click", ()=>{
  if(!confirm("Undo all unsaved changes on this record?")) return;
  current = JSON.parse(originalSnapshot);
  dirty = false;
  render();
});

$("#btnDuplicate").addEventListener("click", ()=>{
  current = JSON.parse(JSON.stringify(current));
  current.id = null;
  current.savedAt = null;
  current.staffName = current.staffName ? current.staffName + " (copy)" : "";
  dirty = true;
  originalSnapshot = JSON.stringify(defaultRecord());
  activeTab = "form";
  render();
});

$("#btnDelete").addEventListener("click", async ()=>{
  if(!current.id) return;
  if(!confirm("Delete this pensioner's record permanently? This cannot be undone.")) return;
  await deleteRecordStorage(current.id);
  current = defaultRecord();
  originalSnapshot = JSON.stringify(current);
  dirty = false;
  activeTab = "form";
  await refreshRecordList();
  render();
});

$("#searchBox").addEventListener("input", renderRecordList);
$("#btnToggleSidebar").addEventListener("click", ()=>{
  document.querySelector(".sidebar").classList.toggle("open");
});

function flashStatus(msg, kind){
  const el = $("#sideStatus");
  el.innerHTML = `<div class="status ${kind==='ok'?'ok':'err'}">${escapeHtml(msg)}</div>`;
  setTimeout(()=>{ el.innerHTML=""; }, 3500);
}

(async function init(){
  await refreshRecordList();
  render();
})();
</script>
